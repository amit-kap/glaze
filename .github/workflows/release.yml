name: Release

# Releases @amit-kap/glaze when main has a version that isn't released yet:
# bump "version" in packages/ui/package.json and merge. A version counts as
# released once its v<version> tag exists (on the release branch).

on:
  push:
    branches: [main]
    paths: [packages/ui/package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release branch and its tag
  id-token: write # npm trusted publishing (and provenance)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and the release branch

      - name: Check for an unreleased version
        id: version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Token contract, lint, typecheck
        if: steps.version.outputs.release == 'true'
        run: |
          npm run check:tokens
          npm run check:catalog
          npx turbo lint typecheck

      - name: Build, publish to npm, push the release tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/glaze-release.mjs --npm --push

      # Studio deploys from the newest published version, and only rebuilds when
      # main changes. A release doesn't change main, so ask Cloudflare to rebuild.
      # npm takes a few minutes to list a new version, and a rebuild before then
      # would pick up the old one, so wait for it first.
      - name: Rebuild Glaze Studio on Cloudflare
        if: steps.version.outputs.release == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No CLOUDFLARE_DEPLOY_HOOK secret: Studio is not rebuilt."
            exit 0
          fi
          for i in $(seq 1 30); do
            if [ "$(npm view "@amit-kap/glaze@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
              echo "Asked Cloudflare to rebuild Studio on $VERSION."
              exit 0
            fi
            sleep 20
          done
          # The release itself succeeded; a missed rebuild must not fail it.
          echo "::warning::$VERSION was not listed on npm after 10 minutes, so Studio was not rebuilt."

      - name: Summary
        if: steps.version.outputs.release == 'true'
        run: |
          echo "Released [@amit-kap/glaze@${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@amit-kap/glaze/v/${{ steps.version.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
