name: Pages

# Publishes the docs site to GitHub Pages on every push to main:
#   /            the showcase (theme builder)
#   /storybook/  Storybook
# Both build with relative asset paths, so they work under /glaze/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the showcase and Storybook
        run: |
          npm run build -w showcase -- --base=./
          npm run build -w storybook
          mkdir -p _site
          cp -R apps/showcase/dist/. _site/
          cp -R apps/storybook/dist _site/storybook

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
